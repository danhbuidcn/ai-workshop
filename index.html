<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Làm việc với AI – Các buổi học</title>
<link rel="icon" href="data:,">
<style>
  :root { --ink: #1f2937; --muted: #5f6672; --bg: #fffaf3; --line: #d1d5db; --hi: #f59e0b; --hi-ink: #b45309; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; line-height: 1.5; }
  main { max-width: 760px; margin: 0 auto; padding: 56px 24px; }
  h1 { font-size: 40px; margin: 0 0 8px; }
  .sub { color: var(--muted); font-size: 20px; margin: 0 0 36px; }
  .list { display: grid; gap: 16px; }
  .card { display: block; padding: 22px 26px; background: #fff; border: 2px solid var(--line);
    border-left: 12px solid var(--hi); border-radius: 12px; color: inherit; text-decoration: none; }
  .card:hover, .card:focus { border-color: var(--hi); outline: none; }
  .card b { font-size: 24px; display: block; }
  .card span { color: var(--muted); font-size: 18px; }
  .num { color: var(--hi-ink); font-weight: 700; font-size: 18px; }
</style>
</head>
<body>
<main>
  <h1>Làm việc với AI</h1>
  <p class="sub">Chọn một buổi học để xem nội dung.</p>
  <div class="list" id="list"></div>
</main>
<script>
  // Thêm buổi mới: thêm 1 dòng vào mảng này.
  var BUOI = [
    { n: 1, title: 'Làm việc với AI — workshop 1 giờ', desc: 'Tư duy phản biện, AI là gì, 5 nguyên tắc, cách giao việc, cho AI đọc tài liệu · 37 slide', href: 'buoi-1/index.html' }
  ];
  var list = document.getElementById('list');
  BUOI.forEach(function (b) {
    var a = document.createElement('a');
    a.className = 'card'; a.href = b.href;
    var n = document.createElement('div'); n.className = 'num'; n.textContent = 'Buổi ' + b.n;
    var t = document.createElement('b'); t.textContent = b.title;
    var d = document.createElement('span'); d.textContent = b.desc;
    a.appendChild(n); a.appendChild(t); a.appendChild(d);
    list.appendChild(a);
  });
</script>
</body>
</html>
